# AWS Amplify custom response headers
customHeaders:
  # Hashed build assets (CSS, JS, fonts, optimized images) never change: cache for a year
  - pattern: '/_astro/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Security headers for every page
  - pattern: '**/*'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
